apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validation-job
  labels:
    app: shard-validation
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: shard-validation
    spec:
      restartPolicy: Never
      containers:
      - name: validator
        image: shard-validator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "250m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"