services:
  api:
    build:
      context: ../Question-1
      dockerfile: ../Question-1/Dockerfile
    image: spam-api:redis-cache
    container_name: spam-api-redis
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - CACHE_TTL_SECONDS=250
    depends_on:
      - cache

  cache:
    image: redis:7-alpine
    container_name: redis-cache
    ports:
      - "6379:6379"
